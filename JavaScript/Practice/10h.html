<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects</title>
    <style>
      body{
        font-family: Arial;
      }
      .subscribe-button {
        border: none;
        background-color: black;
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-right: 15px;
        padding-left: 15px;
        font-weight: bold;
        border-radius: 50px;
        cursor : pointer;
        margin-bottom : 30px;
      }
      .is-subscribed{
        background-color: rgb(240, 240, 240);
        color: black;
      }
      .cost-input{
        font-size: 15px;
        /* padding-top: 10px;
        padding-bottom: 10px;
        padding-right: 10px;
        padding-left: 10px; */
        padding : 10px
      }
      .calculate-button {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding : 10px 50px;
        cursor: pointer;
      }
      .error-message
      {
        color: red;
      }
    </style>
  </head>
  
  <body>
    <p>Youtube Subscribe Button</p>

    <button onclick="subscribe();"
    class = 'js-subscribe-button subscribe-button'>Subscribe</button>

    <p>Amazon Shipping Calaculator</p>

    <input placeholder="Cost of order" class = 'js-cost-input cost-input'  onkeydown="handleCostKeydown(event);" >

    <button onclick="CalculateTotal();" class = "calculate-button">Calculate</button>
    <p class = 'js-total-cost '></p>
    <p class="js-error-message error-message"></p>

    <script>
      function handleCostKeydown(event) {
        if(event.key === 'Enter') {
         CalculateTotal(); 
        }
      }
      function CalculateTotal() {
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value);

         // First, reset all previous messages.
        document.querySelector('.js-total-cost')
          .innerHTML = '';
        document.querySelector('.js-error-message')
          .innerHTML = '';

        if(cost < 0)
        {
          document.querySelector('.js-error-message').innerHTML = `Error Cost cannot be less than $0`;
          return
        }

        else if(cost < 40) {
          cost = cost + 10;
        }
        document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
        
        // } else if (cost >= 50)
        // {
        //   cost = cost
        // }

      }

      function subscribe()
      {
        const buttonElement = document.querySelector('.js-subscribe-button');
        if(buttonElement.innerText === 'Subscribe') {
          buttonElement.innerText = 'Subscribed';
          buttonElement.classList.add('is-subscribed');
        } else{
          buttonElement.innerText = 'Subscribe';
          buttonElement.classList.remove('is-subscribed');
        }
      }
      function isLessZero()
      {
        const buttonElement = document.querySelector('.js-total-cost');
        if(buttonElement.classList.contains('lessZero'))
        {
          buttonElement.classList.add('error-message');
        }
        else
        {
          buttonElement.classList.remove('error-message');

        }
      }
    </script>
  </body>
</html>
