    // words = ['green','red','blue' ,'red'];
    words = ['red', 'green', 'green' , 'red'];
    function findIndex(arr,word)
    {
      let index = -1;
      for(let i = 0; i < arr.length; i++)
      {
        if(arr[i] === word) 
        {
          return index = i;
        }
      }
      return index;
    }

    function unique(arr)
    {
      let result = [];

      for(let i = 0; i < arr.length; i++)
      {
        if(findIndex(result, arr[i]) === -1)
        {
          result.push(arr[i]);
        }        
      } 
      return result; 
    }
