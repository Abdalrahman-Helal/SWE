<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="console.log(`Cart Quantity : ${cartQuantity}`);"> Show Quantity</button>
    
    <button onclick="UpdateCartQuantity(1)"> Add to cart</button>

    <button onclick="UpdateCartQuantity(2)"> +2</button>

    <button onclick="UpdateCartQuantity(3)"> +3</button>

    <button onclick="UpdateCartQuantity(-1) "> Remove from Cart</button>

    <button onclick=" UpdateCartQuantity(-2)"> Remove 2</button>

    <button onclick=" UpdateCartQuantity(-3)"> Remove 3</button>

    <button onclick="console.log('cart was reset'); console.log(`Cart Quantity : ${cartQuantity = 0}`) "> Reset Cart</button>

    <script>
      let cartQuantity = 0;
      let maxQuantity = 10;

      function UpdateCartQuantity(value)
      {
        if(cartQuantity + value > 10)
        {
          alert('The cart is full');
          return
        }

        if(cartQuantity + value < 0)
        {
          alert('Not enough items in the cart');
          return
        }
      
        cartQuantity + value <= maxQuantity && cartQuantity + value >= 0 ? cartQuantity = cartQuantity + value : console.log('Cart is full'); 
        console.log(`Cart Quantity : ${cartQuantity}`);
      }
    </script>
  </body>
</html>
