<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors.css">
  </head>
  <body>
    <p class = 'title'>Rock Paper Scissors</p>

    <button class = 'move-button'> <img src="Images/rock-emoji.png" class="move-icons js-rock-button" ></button>

    <button class = 'move-button'> <img src="Images/paper-emoji.png" class="move-icons js-paper-button" ></button>

    <button class = 'move-button'><img src="Images/scissors-emoji.png " class="move-icons js-scissors-button"></button>

    <p class="js-result result"></p>
    <p class="js-moves">
      You 
      <img src="Images/rock-emoji.png" class="move-icons">  
      <img src="Images/scissors-emoji.png" class="move-icons">
      Computer
    </p>
    <p class="js-score score" ></p>

    <button class = 'reset-score-button js-reset-button'>Reset Score</button>

    <button class="auto-play-button js-autoPlay-button">Auto Play</button>
    <p class="js-p-confirm"></p>
    

    <script src="rock-paper-scissors.js" >
    </script>
  </body>
</html>
